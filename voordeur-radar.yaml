# VoordeurLamp - persoonsdetectie met mmWave-radar
# Hardware: Seeed XIAO ESP32-S3 + Seeed 24GHz mmWave for XIAO (HLK-LD2410B), gestapeld.
# Specificatie: specs/001-mmwave-person-detection/

substitutions:
  device_name: voordeur-radar
  friendly_name: Voordeur radar
  # De radar-UART zit via de header op XIAO D2/D3 (schema: J1 pin 10 "TX", pin 11 "RX";
  # D6/D7 zijn op de radarmodule niet aangesloten). Bij "sensor_timeout": omwisselen.
  radar_rx_pin: GPIO3    # XIAO D2 <- TX van de radar
  radar_tx_pin: GPIO4    # XIAO D3 -> RX van de radar
  # XIAO D10 (GPIO9) is de OUT-pin van de radar: niet gebruiken als uitgang.

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.2

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  framework:
    type: esp-idf
    version: 5.5.6
    platform_version: 55.3.312

logger:
  # DEBUG toont per beoordeelde beweging een "eval"-regel (afstemmen, US4); INFO voor normaal gebruik.
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key
  # Constitutie III / FR-016: niet herstarten als Home Assistant onbereikbaar is.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${device_name}-fallback
    password: !secret ap_password

captive_portal:

debug:
  update_interval: 60s

external_components:
  - source:
      type: local
      path: components

uart:
  id: radar_uart
  rx_pin:
    number: ${radar_rx_pin}
    # GPIO3 is een strapping-pin (JTAG-bronkeuze), maar alleen als de eFuse STRAP_JTAG_SEL is
    # gezet; standaard niet. Seeed gebruikt XIAO D2 zo voor deze radar.
    ignore_strapping_warning: true
  tx_pin: ${radar_tx_pin}
  baud_rate: 256000
  rx_buffer_size: 1024

door_radar:
  id: radar
  uart_id: radar_uart
  # Alleen-YAML afstemwaarden (standaard zoals hieronder):
  # reversal_hysteresis: 0.3m
  # evaluation_window: 1500ms
  # background_margin: 15
  # background_time_constant: 30s
  # startup_time: 5s
  # sensor_timeout: 3s
  # ack_timeout: 500ms

# --- Bediening en automatisering (contracts/ha-entities.md) ---
binary_sensor:
  - platform: door_radar
    presence:
      name: Persoon aanwezig
    sensor_fault:
      name: Radar storing

event:
  - platform: door_radar
    detection:
      name: Detectie

text_sensor:
  - platform: door_radar
    direction:
      name: Richting
    reject_reason:
      name: Afwijzingsreden
  - platform: debug
    reset_reason:
      name: Reset-oorzaak

# --- Diagnose ---
sensor:
  - platform: door_radar
    position:
      name: Positie
    speed:
      name: Snelheid
    # Uitgemiddeld voor een rustigere grafiek in Home Assistant; de detectie zelf gebruikt de
    # ruwe metingen. Voor afstemmen kan "max" (hoogste waarde per periode) handiger zijn:
    #   filters: &zone_filter
    #     - max: { window_size: 5, send_every: 5 }
    gate_energy:
      - name: Zone 0 energie
        filters: &zone_filter
          - throttle_average: 5s
      - name: Zone 1 energie
        filters: *zone_filter
      - name: Zone 2 energie
        filters: *zone_filter
      - name: Zone 3 energie
        filters: *zone_filter
      - name: Zone 4 energie
        filters: *zone_filter
      - name: Zone 5 energie
        filters: *zone_filter
      - name: Zone 6 energie
        filters: *zone_filter
      - name: Zone 7 energie
        filters: *zone_filter
      - name: Zone 8 energie
        filters: *zone_filter
    # Drempel waarboven een zone als beweging telt (geleerde achtergrond + marge, minimaal de
    # "Zone N minimale energie"). Verandert langzaam; wordt alleen bij verandering verstuurd.
    gate_threshold:
      - name: Zone 0 drempel
      - name: Zone 1 drempel
      - name: Zone 2 drempel
      - name: Zone 3 drempel
      - name: Zone 4 drempel
      - name: Zone 5 drempel
      - name: Zone 6 drempel
      - name: Zone 7 drempel
      - name: Zone 8 drempel

# --- Configuratie: drempels instelbaar vanuit Home Assistant (FR-011) ---
number:
  - platform: door_radar
    min_range:
      name: Minimale afstand
    max_range:
      name: Maximale afstand
    min_speed:
      name: Minimale snelheid
    max_speed:
      name: Maximale snelheid
    min_duration:
      name: Minimale duur
    min_displacement:
      name: Minimale verplaatsing
    max_pause:
      name: Toegestane pauze
    absent_timeout:
      name: Wegtijd
    max_hold:
      name: Maximale vasthoudtijd
    gate_min_energy:
      - name: Zone 0 minimale energie
      - name: Zone 1 minimale energie
      - name: Zone 2 minimale energie
      - name: Zone 3 minimale energie
      - name: Zone 4 minimale energie
      - name: Zone 5 minimale energie
      - name: Zone 6 minimale energie
      - name: Zone 7 minimale energie
      - name: Zone 8 minimale energie
