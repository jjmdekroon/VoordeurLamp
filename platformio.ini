; PlatformIO wordt in dit project alleen gebruikt als testrunner voor de framework-vrije
; detectielogica (constitutie v2.0.0, principe II). De firmware wordt gebouwd met ESPHome:
;   esphome compile voordeur-radar.yaml
; Host-tests:
;   pio test -e native

[platformio]
src_dir = components/door_radar

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
; Bestanden met prefix door_radar zijn ESPHome-lijm en horen niet in de host-build.
build_src_filter = +<*> -<door_radar*>
build_flags = -std=gnu++17 -Wall -Wextra
; Statisch linken: anders laadt Windows soms een andere libstdc++-DLL uit het PATH (0xC0000139).
extra_scripts = post:test/support/static_link.py
